<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线听与学</title><style>body{font:16px system-ui;max-width:780px;margin:2rem auto;padding:1rem}button,input,textarea{font:inherit;margin:.4rem}textarea{width:95%;min-height:7rem}li{margin:1rem 0}[hidden]{display:none}#status{white-space:pre-wrap}</style><h1>离线听与学</h1><p>下载仅保存此设备的原音和学习资料，授权最长 24 小时。断网时无法实时获知服务器撤回；重新联网会先核对授权。浏览器可能驱逐下载副本。</p><p><a href="/">返回在线站点</a></p><p id="status" role="status">检查离线能力…</p><button id="enable">授权此设备</button><button id="check">核对授权</button><button id="clear">撤回授权并清理本设备</button><button id="clean-downloads">仅清理下载副本</button><button id="view-synced">查看已同步整理</button><div id="synced-drafts"></div><section id="locked-drafts" hidden><p>授权已锁定，以下待同步文字可复制；不会自动迁移到新会话。</p><textarea id="locked-text" readonly aria-label="锁定待同步文字"></textarea></section><section id="private" hidden><h2>选择下载内容</h2><div id="catalog-sources"></div><div id="catalog-articles"></div><div id="catalog-excerpts"></div><button id="download">下载选定来源</button><button id="cancel">取消下载</button><button id="cancel-incomplete">清理未完成下载</button><ul id="files"></ul><audio id="audio" controls preload="metadata"></audio><h2>本地文字</h2><p>保存失败时请复制下方文字；同步冲突也保留文字。</p><textarea id="text" maxlength="20000" aria-label="离线文字"></textarea><button id="save-note">保存笔记</button><button id="save-reflection">保存整理</button><button id="save-progress">保存原音进度</button><button id="sync">明确同步待同步操作</button><pre id="outbox"></pre></section><button id="update" hidden>安全安装更新</button><script src="/static/offline-core.js"></script><script src="/static/offline-storage.js"></script><script src="/static/offline-packs.js"></script><script src="/static/offline-operations.js"></script><script src="/static/offline-shell.js"></script></html>
