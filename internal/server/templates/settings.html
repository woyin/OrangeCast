{{define "title"}}设置 · CloudWisePod{{end}}
{{define "content"}}
<h1>设置</h1>
<p class="hint">AI Provider 固定为 <strong>Groq</strong>（默认零成本）。付费 Provider 仅在对单次任务显式授权时使用（ADR-0009）。</p>
<form method="post" action="/settings">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <label>转录模型<input type="text" name="transcription_model" value="{{.TranscriptionModel}}" placeholder="默认：whisper-large-v3"></label>
  <label>分析模型<input type="text" name="analysis_model" value="{{.AnalysisModel}}" placeholder="默认：llama-3.3-70b-versatile"></label>
  <label>问答模型<input type="text" name="qa_model" value="{{.QAModel}}" placeholder="默认：llama-3.3-70b-versatile"></label>
  <button type="submit">保存</button>
</form>
{{if .Saved}}<p class="success">已保存。</p>{{end}}
{{end}}
