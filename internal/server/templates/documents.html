{{define "title"}}文档素材 · CloudWisePod{{end}}
{{define "content"}}<div class="page-head"><h1>文档素材</h1><a class="btn" href="/documents/new">粘贴新文档</a></div><p class="meta">每一条是不可变 EvidenceDocument 快照。</p>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}<section class="panel"><h2>抓取网页快照</h2><form method="post" action="/documents/import"><input type="hidden" name="_csrf" value="{{.CSRF}}"><label>网页 URL <input type="url" name="url" required></label><label>标题（可选）<input name="title"></label><button class="btn" type="submit">抓取并保存快照</button></form></section>{{range .Documents}}<div class="list-item"><a href="/documents/{{.ID}}"><h3>{{.Title}}</h3><p class="meta">{{.OriginKind}} · {{.CreatedAt}} · SHA-256 {{.ContentSHA256}}</p></a></div>{{else}}<p class="empty">暂无文档素材。</p>{{end}}{{end}}
