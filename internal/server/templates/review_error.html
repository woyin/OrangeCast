{{define "title"}}回顾未保存{{end}}{{define "content"}}<h1>回顾未保存</h1><p class="error">{{.Error}}</p>{{if eq .Action "answer"}}<form action="/review/action" method="post"><input name="_csrf" type="hidden" value="{{.CSRF}}"><input name="item" type="hidden" value="{{.Item}}"><input name="expected_revision" type="hidden" value="{{.Expected}}"><input name="assessment" type="hidden" value="{{.Assessment}}"><textarea name="answer" rows="8">{{.Answer}}</textarea><button name="action" value="answer">重试保存解释</button></form>{{end}}{{if eq .Action "settings"}}<form method="post" action="/review/action"><input name="_csrf" type="hidden" value="{{.CSRF}}"><input name="action" type="hidden" value="settings"><label><input name="enabled" type="checkbox" {{if .Enabled}}checked{{end}}>开启每周回顾</label><label>时区 <input name="timezone" value="{{.Timezone}}"></label><label>每周日期 <input type="number" name="weekday" min="0" max="6" value="{{.Weekday}}"></label><label>时间 <input name="clock_time" type="time" value="{{.ClockTime}}"></label><button>重试保存设置</button></form>{{end}}<p><a href="/review">返回回顾核对当前版本</a></p>{{end}}
