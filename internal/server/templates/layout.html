{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}CloudWisePod{{end}}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/private-state.js"></script>
<script src="/static/view-lifecycle.js"></script>
<script src="/static/playback-controller.js"></script>
<script src="/static/article-drafts.js"></script>
<script src="/static/knowledge-source-picker.js" defer></script>
</head>
<body>
<nav class="navbar">
  <a href="/dashboard" class="brand">CloudWisePod</a>
  <div class="nav-links">
    <a href="/podcasts">播客</a>
    <a href="/knowledge-articles">知识文章</a>
    <a href="/notes">笔记/重点</a><a href="/search">搜索</a><a href="/questions">学习问题</a><a href="/review">回顾</a><a href="/listening-queue">稍后听</a>
    <details class="nav-advanced"><summary>更多</summary><div>    <a href="/attention">注意力队列</a>
    <a href="/workbench">创作工作空间（迁移）</a>
    <a href="/uploads">上传</a>
    <a href="/documents">文档</a>
    <a href="/keypoints">要点</a>
    <a href="/themes">主题</a>
    <a href="/graph">图谱</a>
    <a href="/progress">进度</a>
    <a href="/settings">设置</a>
</div></details>
    <a href="/logout">登出</a>
  </div>
</nav>
<aside id="listening-shell" class="panel listening-shell" hidden aria-label="当前收听">
<a id="listening-title" href="/listening-queue"></a><span id="listening-position"></span>
<button id="listening-toggle" type="button">播放</button><button id="listening-back" type="button">−15秒</button><button id="listening-forward" type="button">+15秒</button><button id="listening-prev" type="button">上一项</button><button id="listening-next" type="button">下一项</button>
<label>睡眠<select id="listening-sleep"><option value="0">关闭</option><option value="15">15分钟</option><option value="30">30分钟</option><option value="60">60分钟</option></select></label><label>循环起点（秒）<input id="listening-loop-start" type="number" min="0" step="0.1"></label><label>循环终点（秒）<input id="listening-loop-end" type="number" min="0" step="0.1"></label><button id="listening-loop-set" type="button">循环原音区间</button><button id="listening-loop-clear" type="button">关闭循环</button><button id="listening-note" type="button">记录当前播放</button><button id="listening-stop" type="button">停止并清空播放会话</button>
<p id="listening-feedback" aria-live="polite"></p>
<form id="listening-note-form" hidden><p id="listening-note-anchor"></p><label>我的理解<textarea id="listening-note-content" rows="3" required></textarea></label><button type="submit">保存当前播放的笔记</button><button id="listening-note-cancel" type="button">收起</button><span id="listening-note-feedback" aria-live="polite"></span></form>
</aside>
<p id="navigation-feedback" class="container" aria-live="polite" hidden></p>
<main class="container" id="page-view" tabindex="-1">
{{block "content" .}}{{end}}
</main>
<script>
(function() {
  function localTime(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';
    const iso = raw.includes('T') ? raw : raw.replace(' ', 'T');
    const date = new Date(/[zZ]|[+-]\\d{2}:\\d{2}$/.test(iso) ? iso : iso + 'Z');
    if (Number.isNaN(date.getTime())) return raw;
    return new Intl.DateTimeFormat(undefined, {dateStyle: 'medium', timeStyle: 'short'}).format(date);
  }
  window.cwpLocalTime = localTime;
  document.querySelectorAll('[data-utc]').forEach(function(node) {
    node.textContent = localTime(node.dataset.utc);
    node.title = node.dataset.utc + ' UTC';
  });
})();
</script>
<script src="/static/safe-render.js"></script>
<script src="/static/dj-player.js"></script>
<script src="/static/listening-session.js"></script>
<script src="/static/player.js"></script>
<script src="/static/owner-notes.js"></script>
<script src="/static/learning-questions.js"></script>
<script src="/static/dj-view.js"></script>
<script src="/static/knowledge-articles.js"></script>
<script src="/static/review.js"></script>
<script src="/static/page-actions.js"></script>
<script src="/static/listening-queue.js"></script>
<script src="/static/app-navigation.js"></script>
</body>
</html>{{end}}
