{{define "title"}}知识图谱 · CloudWisePod{{end}}
{{define "content"}}
<h1>知识图谱</h1>
<p class="hint">每个节点是一集已处理的 Episode，共享 Tag 越多的 Episode 靠得越近。点击节点查看详情。</p>

<svg id="graph-svg" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:8px;background:#fff"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function() {
  const svg = d3.select('#graph-svg');
  const width = svg.node().clientWidth;
  const height = svg.node().clientHeight;

  fetch('/api/graph').then(r => r.json()).then(data => {
    if (!data.nodes || data.nodes.length === 0) {
      svg.append('text').attr('x', width/2).attr('y', height/2)
        .attr('text-anchor', 'middle').attr('fill', '#999')
        .text('暂无已处理的 Episode。处理播客后会自动生成图谱。');
      return;
    }

    const nodes = data.nodes.map(d => ({...d}));
    const links = (data.links || []).map(d => ({...d}));
    const linkCount = {};
    links.forEach(l => {
      linkCount[l.source] = (linkCount[l.source]||0)+1;
      linkCount[l.target] = (linkCount[l.target]||0)+1;
    });
    nodes.forEach(n => { n.degree = linkCount[n.id] || 0; });

    const simulation = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id(d => d.id).distance(d => 120 - d.tags.length * 15).strength(0.3))
      .force('charge', d3.forceManyBody().strength(-400))
      .force('center', d3.forceCenter(width/2, height/2))
      .force('collision', d3.forceCollide().radius(d => 25 + d.degree * 3));

    const link = svg.append('g').selectAll('line')
      .data(links).enter().append('line')
      .attr('stroke', '#999').attr('stroke-opacity', 0.4)
      .attr('stroke-width', d => Math.min(d.tags.length, 3));

    const node = svg.append('g').selectAll('g')
      .data(nodes).enter().append('g')
      .style('cursor', 'pointer')
      .call(d3.drag()
        .on('start', dragStart)
        .on('drag', dragging)
        .on('end', dragEnd));

    node.append('circle')
      .attr('r', d => 12 + d.degree * 2)
      .attr('fill', d => d3.schemeCategory10[d.degree % 10] || '#4f46e5')
      .attr('stroke', '#fff').attr('stroke-width', 2);

    node.append('text')
      .text(d => d.title.length > 15 ? d.title.slice(0,14)+'…' : d.title)
      .attr('x', 0).attr('y', d => 20 + d.degree * 2)
      .attr('text-anchor', 'middle').attr('font-size', '11px').attr('fill', '#333');

    node.append('title').text(d => d.title + '（连接 ' + d.degree + ' 集）');

    node.on('click', (e, d) => { window.location.href = '/sources/episode/' + d.id; });

    simulation.on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
    });

    function dragStart(e, d) {
      if (!e.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragging(e, d) { d.fx = e.x; d.fy = e.y; }
    function dragEnd(e, d) {
      if (!e.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }
  });
})();
</script>
{{end}}
