{{define "title"}}文章修改未保存{{end}}
{{define "content"}}<h1>修改未保存</h1><p class="error">{{.Error}}</p><p>以下草稿仍保留，可以复制后基于最新修订继续编辑。</p><h2>{{.DraftTitle}}</h2>{{range .DraftBlocks}}<textarea aria-label="未保存的段落" rows="6">{{.}}</textarea>{{end}}{{with .DraftWritingMode}}<p>未保存的文章用途：{{.}}</p>{{end}}{{with .DraftOutline}}<textarea aria-label="未保存的写作计划" rows="8">{{.}}</textarea>{{end}}{{with .DraftInstructions}}<textarea aria-label="未保存的修改要求" rows="4">{{.}}</textarea>{{end}}<a href="/knowledge-articles/{{.Article.ID}}">返回文章</a>{{end}}
