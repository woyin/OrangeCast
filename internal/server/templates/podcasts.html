{{define "title"}}播客 · CloudWisePod{{end}}
{{define "content"}}
<div class="page-head"><h1>播客订阅</h1><div><a href="/podcasts/new" class="btn">添加播客</a> <a href="/podcasts/opml" class="btn btn-secondary">导入 OPML</a></div></div>
{{range .Podcasts}}
<div class="list-item">
  <a href="/podcasts/{{.ID}}">
    {{if .ImageURL}}<img src="{{.ImageURL}}" alt="" class="thumb">{{end}}
    <div><h3>{{.Title}}</h3><p>{{.Description}}</p>{{if eq .IngestionPolicy "manual"}}<p class="meta">仅发现：新单集需手动入队</p>{{end}}</div>
  </a>
</div>
{{else}}
<p class="empty">还没有订阅播客。<a href="/podcasts/new">添加第一个</a></p>
{{end}}
{{end}}
