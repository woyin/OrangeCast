{{define "notePanel"}}
<section class="panel" id="owner-notes" data-source-type="{{.SourceType}}" data-source-id="{{.SourceID}}" data-snapshot="{{.NoteSnapshotID}}" data-version="{{.NoteSnapshotVersion}}">
<h2>学习笔记</h2><p class="meta">来源笔记记录原文表达；我的理解归属于你。位置和依据自动保存。</p>
<div id="note-list">{{range .OwnerNotes}}<article id="note-{{.ID}}"><strong>{{if eq .Kind "source_note"}}来源笔记{{else}}我的理解{{end}}</strong> <span class="meta" data-note-revision>v{{.Revision}}</span><p>{{.Content}}</p><a href="{{noteHref .}}">查看记录位置</a> · <a href="/notes/{{.ID}}/history">修订历史</a>
<form method="post" action="/api/owner-notes" class="note-form"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="action" value="delete"><input type="hidden" name="note_id" value="{{.ID}}"><input type="hidden" name="expected_revision" value="{{.Revision}}"><input type="hidden" name="source_type" value="{{$.SourceType}}"><input type="hidden" name="source_id" value="{{$.SourceID}}"><button type="submit">删除</button><span class="note-feedback" aria-live="polite"></span></form>
<details><summary>编辑笔记</summary><form method="post" action="/api/owner-notes" class="note-form"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="note_id" value="{{.ID}}"><input type="hidden" name="expected_revision" value="{{.Revision}}"><input type="hidden" name="source_type" value="{{$.SourceType}}"><input type="hidden" name="source_id" value="{{$.SourceID}}"><input type="hidden" name="kind" value="{{.Kind}}"><input type="hidden" name="citations_json" value="{{.CitationsJSON}}"><input type="hidden" name="references_json" value="{{.ReferencesJSON}}"><textarea aria-label="笔记内容" name="content" rows="3" required>{{.Content}}</textarea><button type="submit">保存编辑</button><span class="note-feedback" aria-live="polite"></span></form></details></article>{{end}}</div>
<form method="post" action="/api/owner-notes" class="note-form" id="quick-note-form"><input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="source_type" value="{{.SourceType}}"><input type="hidden" name="source_id" value="{{.SourceID}}"><input type="hidden" name="citations_json" value="[]"><input type="hidden" name="references_json" value="[]"><input type="hidden" name="anchor_json" value="{&quot;no_position&quot;:true}">
<label>类型 <select name="kind"><option value="owner_reflection">我的理解</option><option value="source_note">来源笔记（先选择原文）</option></select></label><p id="note-anchor-preview" class="meta">未选择原文；可以直接记录个人理解。</p>
<button id="note-playing" type="button" hidden>记录当前播放</button><button id="note-now" type="button">记一下当前播放位置</button><button id="note-selection" type="button">选中文字记笔记</button>
<label>内容 <textarea name="content" rows="3" required></textarea></label><button type="submit">保存笔记</button><span class="note-feedback" aria-live="polite"></span></form>
</section>
{{end}}
