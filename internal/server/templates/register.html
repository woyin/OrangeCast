{{define "title"}}认领实例 · CloudWisePod{{end}}
{{define "content"}}
<main class="auth">
<h1>认领 CloudWisePod 实例</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<p class="hint">本实例尚未被认领。创建唯一 Owner 后，注册将永久关闭（ADR-0003）。</p>
<form method="post" action="/register">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <label>邮箱<input type="email" name="email" required></label>
  <label>密码（至少 8 位）<input type="password" name="password" required></label>
  <button type="submit">认领实例</button>
</form>
<p><a href="/login">已有 Owner 账号？登录</a></p>
</main>
{{end}}
