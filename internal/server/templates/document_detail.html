{{define "title"}}{{.Document.Title}} · 文档素材{{end}}
{{define "content"}}<div class="page-head"><h1>{{.Document.Title}}</h1><a class="btn btn-secondary" href="/documents">返回文档素材</a></div><p class="meta">EvidenceDocument · {{.Document.OriginKind}} · SHA-256 {{.Document.ContentSHA256}}</p><section class="panel"><h2>可核验段落</h2>{{range .Segments}}<article id="{{.ID}}" style="margin:1rem 0"><p class="meta">段落 {{.Position}} · Citation ID: {{.ID}}</p><pre style="white-space:pre-wrap">{{.Text}}</pre><form method="post" action="/documents/keypoints"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="document_id" value="{{$.Document.ID}}"><input type="hidden" name="segment_id" value="{{.ID}}"><label>KeyPoint <input name="content" required placeholder="基于该段原文写出可复用观点"></label><label>说明 <input name="description" placeholder="可选"></label><button class="btn btn-secondary" type="submit">加入素材 Inbox</button></form></article>{{end}}</section>{{end}}
