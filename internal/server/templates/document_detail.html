{{define "title"}}{{.Document.Title}} · 文档素材{{end}}
{{define "content"}}<div class="page-head"><h1>{{.Document.Title}}</h1><a class="btn btn-secondary" href="/documents">返回文档素材</a></div><p class="meta">EvidenceDocument · {{.Document.OriginKind}} · SHA-256 {{.Document.ContentSHA256}}</p><section class="panel"><h2>可核验段落</h2>{{range .Segments}}<article id="{{.ID}}" style="margin:1rem 0"><p class="meta">段落 {{.Position}} · Citation ID: {{.ID}}</p><pre style="white-space:pre-wrap">{{.Text}}</pre></article>{{end}}</section>{{end}}
