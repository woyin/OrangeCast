name: CI

# 持续集成：保证仓库只走 Go 单一路径。
# 不依赖 Node/npm/Wrangler；干净 checkout 即可验证。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: go build
        run: go build ./cmd/cloudwisepod

      - name: make cover-gate
        run: |
          go test -coverprofile=/dev/null ./... # 预热，使 -cover 命中缓存更快、输出稳定
          make cover-gate

      - name: make lint
        run: |
          go install github.com/mgechev/revive@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint
