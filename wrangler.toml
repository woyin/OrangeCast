name = "cloudwise-pod"
main = "app/worker.ts"
compatibility_date = "2026-06-15"
compatibility_flags = ["nodejs_compat"]

# Static assets (JS, CSS, images) served before fetch handler
[assets]
directory = "./build/client"
binding = "ASSETS"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "cloudwise_pod"
database_id = "6793d3f1-f83c-4230-997f-d231903f0576"

# R2 Object Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "cloudwise-pod"

# Queue producer (enqueue jobs from HTTP handlers)
[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "cwp-jobs"

# Queue consumer (process jobs)
[[queues.consumers]]
queue = "cwp-jobs"
max_batch_size = 1
max_batch_timeout = 30

# Cron triggers
[triggers]
crons = ["*/30 * * * *"]

# Environment variables (non-secret)
[vars]
APP_NAME = "CloudWisePod"
SESSION_COOKIE_NAME = "cloudwise_session"
UPLOAD_MAX_BYTES = "104857600"
UPLOAD_MAX_SECONDS = "7200"
OPENAI_TRANSCRIPTION_MODEL = "gpt-4o-mini-transcribe"
OPENAI_ANALYSIS_MODEL = "gpt-4.1-mini"
OPENAI_CHAT_MODEL = "gpt-4.1-mini"
