name = "cloudwise-pod"
compatibility_date = "2026-06-14"
pages_build_output_dir = "build/client"

[[d1_databases]]
binding = "DB"
database_name = "cloudwise_pod"
database_id = "replace-with-cloudflare-d1-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "cloudwise-pod"

[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "cloudwise-pod-processing"

# Queue consumers are configured in a separate Worker entrypoint later.

# Set SESSION_SECRET with `wrangler secret put SESSION_SECRET`; do not store it in [vars].
[vars]
APP_NAME = "CloudWisePod"
SESSION_COOKIE_NAME = "cloudwise_session"
UPLOAD_MAX_BYTES = "104857600"
UPLOAD_MAX_SECONDS = "7200"
