services:
  orangecast:
    build:
      context: .
      # 带 Kokoro 解说引擎；只要默认精简镜像可改为 alpine 阶段（删除 target 行并去掉 /models 挂载）
      target: kokoro
    container_name: orangecast
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # 必填：会话密钥（生成：openssl rand -hex 32）
      SESSION_SECRET: ${SESSION_SECRET}
      # 必填：Groq API key（默认零成本 provider）
      GROQ_API_KEY: ${GROQ_API_KEY}
      # 可选：OpenAI key（仅按单次任务显式授权时使用，ADR-0009）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 公网 URL（反向代理场景必须设置，用于 Secure Cookie 与 Markdown 链接）
      # 兼容 .env 里的 BASE_URL 写法：PUBLIC_URL 未设时程序回退到 BASE_URL
      PUBLIC_URL: ${PUBLIC_URL:-${BASE_URL:-http://localhost:8080}}
      # 受信任反向代理（如 Caddy 在宿主网络：172.17.0.1/32；按实际调整）
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 可选：Readwise token（填写后来源页出现“推送高光到 Readwise”）
      READWISE_TOKEN: ${READWISE_TOKEN:-}
      # 可选：容器内的 Obsidian 导出目录；需同时把 vault 目录挂载到该路径（见下方 volumes 注释）
      OBSIDIAN_EXPORT_DIR: ${OBSIDIAN_EXPORT_DIR:-}
      PORT: "8080"
      DATA_DIR: /app/data
    volumes:
      # 宿主 data 目录直接映射（ADR-0010 便携数据目录）：与 make serve 共用同一实例，
      # 但二者严禁同时运行（SQLite 锁 + EvidenceAudio 写入冲突）
      - ./data:/app/data
      # Kokoro 模型权重（kokoro-v1.0.onnx + voices-v1.0.bin），只读
      - ${KOKORO_MODEL_DIR:-${HOME}/.local/share/cloudwisepod/kokoro}:/models:ro
      # Obsidian：取消注释并改成你的 vault 路径，再设置 OBSIDIAN_EXPORT_DIR=/obsidian
      # - ${OBSIDIAN_VAULT_DIR}:/obsidian
